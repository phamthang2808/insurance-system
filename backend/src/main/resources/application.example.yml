spring:
  application:
    name: insurance-system
  profiles:
    active: dev

  # MySQL Configuration
  datasource:
    url: jdbc:mysql://localhost:3307/insurance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: YOUR_DB_USERNAME
    password: YOUR_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # MongoDB Configuration (for Audit Logs)
  # data:
  #   mongodb:
  #     uri: mongodb://YOUR_MONGO_USER:YOUR_MONGO_PASSWORD@localhost:27017/insurance_logs_db?authSource=admin

  # Security & OAuth2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

  # File Upload
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # CORS
  web:
    cors:
      allowed-origins: "http://localhost:5173,http://localhost:3000"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true

server:
  port: 8080
  servlet:
    context-path: /

# Logging
logging:
  level:
    root: INFO
    com.insurance: DEBUG
    org.springframework.security: DEBUG

# JWT Config
app:
  jwt:
    secret: YOUR_JWT_SECRET_BASE64          # Tạo bằng: openssl rand -base64 32
    expiration: 86400000                    # 24 giờ (ms)
    refresh-expiration: 604800000           # 7 ngày (ms)

# Google OAuth2
google:
  oauth2:
    client-id: YOUR_GOOGLE_CLIENT_ID        # Lấy từ Google Cloud Console
    client-secret: YOUR_GOOGLE_CLIENT_SECRET

# OpenAI (nếu dùng)
openai:
  api-key: YOUR_OPENAI_API_KEY              # Lấy từ platform.openai.com

# File Upload Directory
file:
  upload:
    dir: uploads
