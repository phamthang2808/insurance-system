version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: insurance_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: insurance_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: insurance_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mysql_data:
 